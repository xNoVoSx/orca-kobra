name: Feature request
description: Suggest an idea or an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe the workflow or problem, not only the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed solution
      description: A new patch should be small and have a realistic chance of being merged upstream.
  - type: textarea
    id: setup
    attributes:
      label: Printer / setup
      description: e.g. Kobra S1 + ACE 2 Pro, Rinkhals version, Linux distribution
